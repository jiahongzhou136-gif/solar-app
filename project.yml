name: SolarApp
options:
  bundleIdPrefix: com.zhoujh.solar
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"

targets:
  SolarApp:
    type: application
    platform: iOS
    sources:
      - path: SolarApp
    dependencies:
      - target: SolarWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhoujh.solar.app
        INFOPLIST_FILE: SolarApp/Info.plist
        PRODUCT_NAME: SolarApp
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: "NO"
        ENABLE_BITCODE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets: []
      gatherCoverageData: false
      buildTargets:
        - target: SolarWidget
          buildPhases: [sources, frameworks, resources]

  SolarWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: SolarWidget
      - path: SolarApp/SharedConfig.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zhoujh.solar.app.widget
        PRODUCT_NAME: SolarWidget
        INFOPLIST_FILE: SolarWidget/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: "NO"
    scheme: {}

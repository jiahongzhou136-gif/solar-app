name: Build APK

on:
  push:
    branches: [ main, master ]
    paths: [ "android/**", ".github/workflows/build_apk.yml" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.9"

      - name: Build release APK (debug-signed)
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        working-directory: android
        run: |
          SRC="app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$SRC" ]; then SRC="app/build/outputs/apk/release/app-release-unsigned.apk"; fi
          if [ ! -f "$SRC" ]; then echo "apk not found"; ls -R app/build/outputs; exit 1; fi
          cp "$SRC" SolarApp.apk
          ls -lh SolarApp.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolarApp-apk
          path: android/SolarApp.apk
          retention-days: 30
          if-no-files-found: error

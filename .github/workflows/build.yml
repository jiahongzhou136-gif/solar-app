name: Build unsigned IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: |
          cd "${GITHUB_WORKSPACE}"
          # 支持仓库根直接是 ios-app，或 ios-app 作为子目录
          if [ -f project.yml ] && grep -q "SolarApp" project.yml; then
            ROOT="."
          elif [ -f ios-app/project.yml ]; then
            ROOT="ios-app"
          else
            echo "project.yml not found"; exit 1
          fi
          echo "ROOT=$ROOT" >> "$GITHUB_ENV"
          cd "$ROOT"
          xcodegen generate
          ls -la

      - name: Build (no code signing)
        run: |
          cd "${GITHUB_WORKSPACE}/${ROOT}"
          xcodebuild \
            -project SolarApp.xcodeproj \
            -scheme SolarApp \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build

      - name: Package unsigned IPA
        run: |
          cd "${GITHUB_WORKSPACE}/${ROOT}"
          APP="build/Build/Products/Release-iphoneos/SolarApp.app"
          if [ ! -d "$APP" ]; then echo "app not found"; ls -R build/Build/Products; exit 1; fi
          rm -rf Payload SolarApp.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qr SolarApp.ipa Payload
          ls -lh SolarApp.ipa
          echo "IPA_READY=1" >> "$GITHUB_ENV"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: SolarApp-ipa
          path: ${{ env.ROOT }}/SolarApp.ipa
          retention-days: 30
          if-no-files-found: error
